name: release-fork
run-name: "release-fork ${{ github.ref_name }}"

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      # Bun cross-compiles every target from the ubuntu runner (same as the
      # upstream build-cli job). The build script forces OPENCODE_VERSION from
      # packages/opencode/package.json, so bump the version before dispatching.
      - name: Build all platform binaries
        run: bun run --cwd packages/opencode build --minify=false --splitting=false

      - name: Package release archives
        working-directory: packages/opencode/dist
        run: |
          set -e
          for d in opencode-linux-*; do (cd "$d/bin" && tar -czf "../../$d.tar.gz" *); done
          for d in opencode-darwin-* opencode-windows-*; do (cd "$d/bin" && zip -qr "../../$d.zip" *); done
          ls -la *.tar.gz *.zip

      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun ./packages/opencode/script/publish-fork.ts

      # Idempotent: pushing the version tag triggers the `release` workflow,
      # which may already have created the GitHub release for this tag. In that
      # case refresh its assets instead of failing on a duplicate tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          TAG="v${VERSION}"
          ASSETS=(packages/opencode/dist/*.tar.gz packages/opencode/dist/*.zip)
          if gh release view "$TAG" --repo menoxz/opencode >/dev/null 2>&1; then
            echo "release ${TAG} already exists; refreshing assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo menoxz/opencode
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --target "${GITHUB_SHA}" \
              --notes "opencode fork ${VERSION} — install: npm install -g @lux-tech/opencode-ai" \
              --repo menoxz/opencode
          fi
